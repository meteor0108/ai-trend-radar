# Downloads the day's raw source material (scripts/collect.py) and force-pushes it to the `raw` branch,
# a single commit with no history. The Claude Code routine at 03:30 KST reads it from there, because its
# sandbox can reach GitHub but not the paper and news sites.
#
# GitHub may start scheduled runs hours late, so the routine does not rely on the schedule alone: when the
# raw data is not today's, it pushes a commit to `claude/collect-request`, which starts this workflow at once.
name: Collect sources

on:
  schedule:
    - cron: "23 17 * * *"  # 02:23 KST; off the hour, when GitHub's scheduler is less congested
  workflow_dispatch:
  push:
    branches: [claude/collect-request]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skip a late scheduled run if today's data is already on the raw branch
        id: check
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if git fetch -q --depth=1 origin raw 2>/dev/null && git show origin/raw:manifest.json | grep -q "\"date\": \"$today\""; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Collect
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect.py --out "$RUNNER_TEMP/raw"

      - name: Publish to the raw branch
        if: steps.check.outputs.skip != 'true'
        run: |
          cd "$RUNNER_TEMP/raw"
          cat manifest.json
          git init -q -b raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "raw: $(TZ=Asia/Seoul date +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" raw

      - name: Remove the request branch
        if: always() && github.ref == 'refs/heads/claude/collect-request'
        run: git push -q origin --delete claude/collect-request || true
